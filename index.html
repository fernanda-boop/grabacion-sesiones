<!doctype html>
<html lang="es">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grabadora de Sesiones - Psicología</title>
  <link rel="stylesheet" href="styles.css">
  <style>@view-transition { navigation: auto; }</style>
  <script src="/_sdk/data_sdk.js" type="text/javascript"></script>
  <script src="/_sdk/element_sdk.js" type="text/javascript"></script>
  <script src="https://cdn.tailwindcss.com" type="text/javascript"></script>
 </head>
 <body>
  <div class="container"><!-- Header -->
   <header>
    <h1>🎙️ Grabadora de Sesiones</h1>
    <p class="subtitle">Graba y guarda tus resúmenes de terapia</p>
   </header><!-- Grabación -->
   <section class="recorder-section">
    <div class="recorder-card">
     <div class="recording-status" id="recordingStatus">
      <div class="status-dot"></div><span>Listo para grabar</span>
     </div>
     <div class="timer" id="timer">
      00:00
     </div>
     <div class="controls"><button id="startBtn" class="btn btn-record"> <span class="btn-icon">⏺</span> Iniciar Grabación </button> <button id="stopBtn" class="btn btn-stop" disabled> <span class="btn-icon">⏹</span> Detener </button>
     </div><!-- Preview del audio grabado -->
     <div id="audioPreview" class="audio-preview hidden">
      <h3>Vista Previa</h3>
      <audio id="previewPlayer" controls></audio>
      <div class="form-group"><label for="sessionTitle">Título de la sesión:</label> <input type="text" id="sessionTitle" placeholder="Ej: Sesión del 15 de enero">
      </div>
      <div class="form-group"><label for="sessionNotes">Notas / Transcripción:</label> <textarea id="sessionNotes" rows="6" placeholder="Escribe aquí tus notas, puntos clave o transcripción..."></textarea>
      </div>
      <div class="preview-controls"><button id="saveBtn" class="btn btn-save"> 💾 Guardar Sesión </button> <button id="discardBtn" class="btn btn-secondary"> 🗑️ Descartar </button>
      </div>
     </div>
    </div>
   </section><!-- Lista de grabaciones -->
   <section class="recordings-section">
    <div class="section-header">
     <h2>📚 Mis Grabaciones</h2><button id="downloadAllBtn" class="btn btn-backup"> 📦 Descargar Backup Completo </button>
    </div>
    <div id="recordingsList" class="recordings-list"><!-- Las grabaciones se cargarán aquí -->
    </div>
    <div id="emptyState" class="empty-state">
     <div class="empty-icon">
      🎤
     </div>
     <p>No hay grabaciones aún</p>
     <p class="empty-subtitle">Comienza grabando tu primera sesión</p>
    </div>
   </section>
  </div>
  <script src="app.js"></script>

</html>
